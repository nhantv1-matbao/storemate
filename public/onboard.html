<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreMate - Hồ Sơ Nhân Sự</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-emerald-600 p-6 text-center text-white">
      <i class="fa-solid fa-mug-hot text-4xl mb-3"></i>
      <h2 class="text-2xl font-bold">StoreMate</h2>
      <p class="text-emerald-100 text-sm mt-1">Hồ Sơ Đăng Ký Nhân Sự (Nội bộ)</p>
    </div>
    
    <form id="onboardForm" class="p-6 space-y-4" onsubmit="submitForm(event)">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Họ và Tên</label>
        <input type="text" id="name" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-slate-50" placeholder="VD: Nguyễn Văn A">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Số Điện Thoại</label>
        <input type="tel" id="phone" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-slate-50" placeholder="VD: 0901234567">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Ngày sinh</label>
          <input type="date" id="dob" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-slate-50">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Vị trí ứng tuyển</label>
          <select id="position" class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-slate-50">
            <option>Barista</option>
            <option>Phục vụ</option>
            <option>Thu ngân</option>
            <option>Giám sát ca</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Chi nhánh mong muốn</label>
        <select id="branch" class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-slate-50">
          <option>StoreMate Central - Q1</option>
          <option>StoreMate Hub - Gò Vấp</option>
          <option>StoreMate Express - Q7</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all mt-4 transform hover:scale-[1.02]">
        <i class="fa-solid fa-paper-plane mr-2"></i> Gửi Hồ Sơ
      </button>
    </form>
  </div>

  <script>
    async function submitForm(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        birthday: document.getElementById('dob').value,
        position: document.getElementById('position').value,
        branch: document.getElementById('branch').value,
        shift: 'Thỏa thuận'
      };

      try {
        const res = await fetch('/api/employees', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          Swal.fire('Thành công!', 'Hồ sơ đã được gửi đến bộ phận NS.', 'success').then(() => {
            document.getElementById('onboardForm').reset();
          });
        } else {
          Swal.fire('Lỗi', data.error, 'error');
        }
      } catch (err) {
        Swal.fire('Lỗi', 'Không thể kết nối đến máy chủ.', 'error');
      }
    }
  </script>
</body>
</html>
