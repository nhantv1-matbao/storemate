<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuyển Dụng & Hồ Sơ - StoreMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
    body { font-family: 'Montserrat', sans-serif; background: url('bg.jpg') no-repeat center center fixed; background-size: cover; }
    .glass-card { backdrop-filter: blur(16px); background-color: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="glass-card max-w-lg w-full rounded-2xl shadow-2xl overflow-hidden">
    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-8 text-center text-white relative">
      <img src="logo.jpg" alt="Logo" class="w-20 h-20 rounded-full border-4 border-white shadow-lg mx-auto mb-4 object-cover" onerror="this.style.display='none'">
      <h2 class="text-2xl font-black tracking-tight">STORE MATE</h2>
      <p class="text-emerald-100 font-semibold text-sm mt-1 uppercase tracking-widest">Gia nhập đội ngũ</p>
    </div>
    
    <form id="onboardForm" class="p-8 space-y-5" onsubmit="submitForm(event)">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Họ và Tên</label>
        <input type="text" id="name" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-white/50" placeholder="VD: Nguyễn Văn A">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Số Điện Thoại</label>
        <input type="tel" id="phone" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-white/50" placeholder="VD: 0901234567">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Ngày sinh</label>
          <input type="date" id="dob" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-white/50">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Vị trí ứng tuyển</label>
          <select id="position" class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-white/50">
            <option>Barista</option>
            <option>Phục vụ</option>
            <option>Thu ngân</option>
            <option>Giám sát ca</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Chi nhánh mong muốn</label>
        <select id="branch" class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-emerald-500 border bg-white/50">
          <option>StoreMate Central - Q1</option>
          <option>StoreMate Hub - Gò Vấp</option>
          <option>StoreMate Express - Q7</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-lg py-4 px-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all mt-6 transform hover:-translate-y-1">
        <i class="fa-solid fa-paper-plane mr-2"></i> GỬI HỒ SƠ
      </button>
    </form>
  </div>

  <script>
    async function submitForm(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value, phone: document.getElementById('phone').value,
        birthday: document.getElementById('dob').value, position: document.getElementById('position').value,
        branch: document.getElementById('branch').value, shift: 'Chưa xếp'
      };
      Swal.fire({ title: 'Đang gửi...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
      try {
        const res = await fetch('/api/employees', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          Swal.fire('Thành công!', 'Hồ sơ của bạn đã được gửi. Hệ thống đã tự động đồng bộ.', 'success').then(() => document.getElementById('onboardForm').reset());
        } else throw new Error(data.error);
      } catch (err) { Swal.fire('Lỗi', err.message, 'error'); }
    }
  </script>
</body>
</html>
