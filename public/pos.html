<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreMate POS - Máy Bán Hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
    body { font-family: 'Montserrat', sans-serif; background: #0f172a; color: #f8fafc; }
    .pos-item { transition: all 0.2s; cursor: pointer; }
    .pos-item:active { transform: scale(0.95); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Left: Products Area -->
  <div class="flex-1 flex flex-col p-6 h-screen">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-500/50">
          <i class="fa-solid fa-store"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-tight text-white">STORE MATE <span class="text-emerald-500">POS</span></h1>
          <p class="text-xs text-slate-400 font-semibold tracking-widest">HỆ THỐNG MÁY TÍNH TIỀN THÔNG MINH</p>
        </div>
      </div>
      <div class="flex gap-4">
        <input type="text" placeholder="Tìm tên món..." class="bg-slate-800 border border-slate-700 text-white rounded-full px-6 py-2 outline-none focus:border-emerald-500 transition w-64 shadow-inner">
      </div>
    </div>
    
    <div class="flex-1 overflow-y-auto pr-2 pb-10">
      <div id="pos-products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- JS DYNAMIC -->
      </div>
    </div>
  </div>

  <!-- Right: Cart & Checkout Area -->
  <div class="w-96 bg-slate-900 border-l border-slate-800 flex flex-col shadow-2xl z-20">
    <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-800/50">
      <h2 class="text-lg font-bold"><i class="fa-solid fa-receipt text-emerald-500 mr-2"></i> HÓA ĐƠN</h2>
      <button onclick="clearCart()" class="text-rose-500 hover:text-rose-400 font-bold text-sm"><i class="fa-solid fa-trash-can mr-1"></i> LÀM TRỐNG</button>
    </div>
    
    <div id="pos-cart" class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- JS DYNAMIC -->
      <div class="h-full flex flex-col items-center justify-center text-slate-600 opacity-50">
        <i class="fa-solid fa-basket-shopping text-4xl mb-4"></i>
        <p class="font-bold">Chưa có món nào được chọn</p>
      </div>
    </div>

    <div class="p-6 bg-slate-950 border-t border-slate-800">
      <div class="mb-4">
        <label class="text-xs text-slate-400 font-bold uppercase mb-2 block">Khách hàng thân thiết (Tích điểm)</label>
        <div class="flex bg-slate-800 rounded-lg overflow-hidden border border-slate-700 focus-within:border-emerald-500 transition">
          <div class="px-4 flex items-center justify-center text-slate-500"><i class="fa-solid fa-phone"></i></div>
          <input type="text" id="pos-phone" placeholder="Nhập số điện thoại..." class="w-full bg-transparent text-white p-3 outline-none font-semibold">
        </div>
      </div>
      
      <div class="flex justify-between items-center mb-6">
        <span class="text-lg font-bold text-slate-400">TỔNG CỘNG:</span>
        <span id="pos-total" class="text-3xl font-black text-emerald-400" data-total="0">0 ₫</span>
      </div>
      
      <button onclick="checkout()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-lg py-5 rounded-xl shadow-lg shadow-emerald-500/20 transition transform hover:-translate-y-1 active:translate-y-0">
        THANH TOÁN TIỀN MẶT
      </button>
      <button onclick="checkout('Chuyển khoản')" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm py-4 rounded-xl transition border border-slate-700">
        <i class="fa-solid fa-qrcode mr-2"></i> THANH TOÁN QUÉT MÃ (QR)
      </button>
    </div>
  </div>

  <script>
    const API = '/api';
    const fMoney = n => new Intl.NumberFormat('vi-VN', {style:'currency',currency:'VND'}).format(n);
    let cart = {};

    window.onload = async () => {
      try {
        const res = await fetch(API+'/products');
        const prods = await res.json();
        const grid = document.getElementById('pos-products');
        grid.innerHTML = '';
        prods.forEach(p => {
          grid.innerHTML += `
            <div onclick="addToCart(${p.id}, '${p.name}', ${p.price})" class="pos-item bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col items-center text-center hover:bg-slate-700 hover:border-emerald-500 group">
              <div class="w-20 h-20 rounded-full bg-slate-900 text-slate-500 group-hover:text-emerald-400 group-hover:bg-slate-800 flex items-center justify-center text-3xl mb-4 transition shadow-inner">
                <i class="fa-solid ${p.image_icon}"></i>
              </div>
              <h4 class="font-bold text-white text-sm mb-2 line-clamp-2">${p.name}</h4>
              <p class="text-emerald-400 font-black tracking-wider">${fMoney(p.price)}</p>
            </div>
          `;
        });
      } catch (err) {
        Swal.fire('Lỗi', 'Không tải được menu!', 'error');
      }
    };

    function addToCart(id, name, price) {
      if(cart[id]) cart[id].qty++;
      else cart[id] = { name, price, qty: 1 };
      renderCart();
    }
    
    function renderCart() {
      const cDiv = document.getElementById('pos-cart');
      let t = 0; cDiv.innerHTML = '';
      if(Object.keys(cart).length === 0) { 
        cDiv.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-slate-600 opacity-50"><i class="fa-solid fa-basket-shopping text-4xl mb-4"></i><p class="font-bold">Chưa có món nào được chọn</p></div>'; 
      }
      Object.keys(cart).forEach(id => {
        let item = cart[id]; t += item.price * item.qty;
        cDiv.innerHTML += `
          <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div>
              <p class="font-bold text-white text-sm">${item.name}</p>
              <p class="text-xs font-semibold text-emerald-500 mt-1">${fMoney(item.price)} <span class="text-slate-500 mx-1">x</span> <span class="text-white">${item.qty}</span></p>
            </div>
            <div class="font-black text-white">${fMoney(item.price*item.qty)}</div>
          </div>
        `;
      });
      document.getElementById('pos-total').innerText = fMoney(t);
      document.getElementById('pos-total').setAttribute('data-total', t);
    }

    function clearCart() { cart = {}; renderCart(); }

    async function checkout(method = 'Tiền mặt') {
      const total = parseInt(document.getElementById('pos-total').getAttribute('data-total'));
      if(!total || total===0) return Swal.fire({title:'Hóa đơn trống!', icon:'warning', background: '#1e293b', color: '#fff'});
      const phone = document.getElementById('pos-phone').value;
      
      Swal.fire({ title: 'Đang in bill...', allowOutsideClick: false, background: '#1e293b', color: '#fff', didOpen:()=>Swal.showLoading()});
      
      try {
        const res = await fetch(API+'/checkout', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ total, phone, payment_method: method })
        });
        const data = await res.json();
        if(res.ok) {
          Swal.fire({title: 'Thanh toán thành công!', html: `<p>Tổng tiền: <b class="text-emerald-400">${fMoney(total)}</b></p>`, icon: 'success', background: '#1e293b', color: '#fff'});
          clearCart(); document.getElementById('pos-phone').value='';
        } else throw new Error(data.error);
      } catch (err) {
        Swal.fire({title: 'Lỗi thanh toán', text: err.message, icon: 'error', background: '#1e293b', color: '#fff'});
      }
    }
  </script>
</body>
</html>
