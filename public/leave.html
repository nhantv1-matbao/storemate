<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreMate - Xin Nghỉ Phép</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-amber-500 p-6 text-center text-white">
      <i class="fa-solid fa-calendar-xmark text-4xl mb-3"></i>
      <h2 class="text-2xl font-bold">StoreMate</h2>
      <p class="text-amber-100 text-sm mt-1">Đơn Xin Nghỉ Phép Trực Tuyến</p>
    </div>
    
    <form id="leaveForm" class="p-6 space-y-4" onsubmit="submitForm(event)">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Mã nhân viên (ID) hoặc Tên</label>
        <select id="empId" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-slate-50">
          <option value="">Đang tải danh sách nhân viên...</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Ngày xin nghỉ</label>
          <input type="date" id="date" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-slate-50">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Ca muốn nghỉ</label>
          <select id="shift" class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-slate-50">
            <option>Ca Sáng</option>
            <option>Ca Chiều</option>
            <option>Ca Tối</option>
            <option>Full-time</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Lý do nghỉ phép</label>
        <textarea id="reason" rows="3" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-slate-50" placeholder="Trình bày lý do ngắn gọn..."></textarea>
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all mt-4 transform hover:scale-[1.02]">
        <i class="fa-solid fa-paper-plane mr-2"></i> Gửi Đơn Xin Nghỉ
      </button>
    </form>
  </div>

  <script>
    // Load employees into dropdown
    window.onload = async () => {
      try {
        const res = await fetch('/api/employees');
        const emps = await res.json();
        const sel = document.getElementById('empId');
        sel.innerHTML = '<option value="">-- Chọn tên của bạn --</option>';
        emps.forEach(e => {
          if (e.status === 'Hoạt động') {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = `[ID: ${e.id}] ${e.name} - ${e.branch}`;
            sel.appendChild(opt);
          }
        });
      } catch (err) {
        console.error(err);
      }
    };

    async function submitForm(e) {
      e.preventDefault();
      const payload = {
        employee_id: document.getElementById('empId').value,
        request_date: document.getElementById('date').value,
        shift_time: document.getElementById('shift').value,
        reason: document.getElementById('reason').value
      };

      try {
        const res = await fetch('/api/leave-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          Swal.fire('Thành công!', 'Đơn của bạn đã được gửi tới Quản lý.', 'success').then(() => {
            document.getElementById('leaveForm').reset();
          });
        } else {
          Swal.fire('Lỗi', data.error, 'error');
        }
      } catch (err) {
        Swal.fire('Lỗi', 'Không thể kết nối đến máy chủ.', 'error');
      }
    }
  </script>
</body>
</html>
