<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn Xin Nghỉ Phép - StoreMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
    body { font-family: 'Montserrat', sans-serif; background: url('bg.jpg') no-repeat center center fixed; background-size: cover; }
    .glass-card { backdrop-filter: blur(16px); background-color: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="glass-card max-w-lg w-full rounded-2xl shadow-2xl overflow-hidden">
    <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-8 text-center text-white relative">
      <img src="logo.jpg" alt="Logo" class="w-20 h-20 rounded-full border-4 border-white shadow-lg mx-auto mb-4 object-cover" onerror="this.style.display='none'">
      <h2 class="text-2xl font-black tracking-tight">STORE MATE</h2>
      <p class="text-amber-100 font-semibold text-sm mt-1 uppercase tracking-widest">Đơn xin nghỉ phép trực tuyến</p>
    </div>
    
    <form id="leaveForm" class="p-8 space-y-5" onsubmit="submitForm(event)">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Mã nhân viên (ID) hoặc Tên</label>
        <select id="empId" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-white/50">
          <option value="">Đang tải danh sách nhân sự...</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Ngày xin nghỉ</label>
          <input type="date" id="date" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-white/50">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Ca muốn nghỉ</label>
          <select id="shift" class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-white/50">
            <option>Ca Sáng</option>
            <option>Ca Chiều</option>
            <option>Ca Tối</option>
            <option>Full-time</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Lý do nghỉ phép</label>
        <textarea id="reason" rows="3" required class="w-full border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-amber-500 border bg-white/50" placeholder="Trình bày lý do ngắn gọn..."></textarea>
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black text-lg py-4 px-4 rounded-xl shadow-lg shadow-amber-500/30 transition-all mt-6 transform hover:-translate-y-1">
        <i class="fa-solid fa-paper-plane mr-2"></i> GỬI ĐƠN NGAY
      </button>
    </form>
  </div>

  <script>
    window.onload = async () => {
      try {
        const res = await fetch('/api/employees');
        const emps = await res.json();
        const sel = document.getElementById('empId');
        sel.innerHTML = '<option value="">-- Chọn tên của bạn --</option>';
        emps.forEach(e => {
          if (e.status === 'Hoạt động') {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = `[ID: ${e.id}] ${e.name}`;
            sel.appendChild(opt);
          }
        });
      } catch (err) { console.error(err); }
    };

    async function submitForm(e) {
      e.preventDefault();
      const payload = {
        employee_id: document.getElementById('empId').value,
        request_date: document.getElementById('date').value,
        shift_time: document.getElementById('shift').value,
        reason: document.getElementById('reason').value
      };
      Swal.fire({ title: 'Đang gửi...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
      try {
        const res = await fetch('/api/leave-requests', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          Swal.fire('Thành công!', 'Đơn của bạn đã được gửi. Hệ thống đã tự động đồng bộ.', 'success').then(() => document.getElementById('leaveForm').reset());
        } else throw new Error(data.error);
      } catch (err) { Swal.fire('Lỗi', err.message, 'error'); }
    }
  </script>
</body>
</html>
