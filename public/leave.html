<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Mate - Xin Nghỉ Phép</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(rgba(241, 245, 249, 0.8), rgba(241, 245, 249, 0.9)), url('/bg.jpg') center/cover no-repeat fixed;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border-t-4 border-amber-500">
    <div class="text-center mb-6">
      <img src="/logo.jpg" alt="Store Mate Logo" class="h-16 w-16 rounded-full object-cover shadow-sm mx-auto mb-3">
      <h2 class="text-2xl font-bold text-slate-800">Xin Nghỉ Phép</h2>
      <p class="text-slate-500 text-sm mt-1">Gửi yêu cầu xin nghỉ phép tới Quản lý</p>
    </div>
    
    <form id="leaveForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Chọn Nhân viên *</label>
        <select id="employee_id" required class="w-full px-4 py-2 rounded border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
          <option value="">-- Chọn tên của bạn --</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Ngày xin nghỉ *</label>
        <input type="date" id="request_date" required class="w-full px-4 py-2 rounded border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Ca muốn nghỉ?</label>
        <select id="shift_time" class="w-full px-4 py-2 rounded border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
          <option>Nghỉ nguyên ngày (Full)</option>
          <option>Nghỉ ca Sáng</option>
          <option>Nghỉ ca Chiều</option>
          <option>Nghỉ ca Tối</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Lý do *</label>
        <textarea id="reason" required rows="2" placeholder="Nhập lý do chi tiết..." class="w-full px-4 py-2 rounded border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded mt-4 transition">Gửi Yêu Cầu</button>
    </form>
    
    <div id="successMsg" class="hidden text-center py-8">
      <div class="text-amber-500 text-5xl mb-4">✓</div>
      <h3 class="text-xl font-bold text-slate-800">Đã gửi!</h3>
      <p class="text-slate-500 mt-2">Yêu cầu xin nghỉ của bạn đang chờ Quản lý duyệt.</p>
    </div>
  </div>

  <script>
    async function init() {
      try {
        const res = await fetch('/api/employees');
        const emps = await res.json();
        const select = document.getElementById('employee_id');
        emps.forEach(e => {
          select.innerHTML += `<option value="${e.id}">${e.name} (${e.branch})</option>`;
        });
      } catch (e) { console.error(e); }
    }

    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        employee_id: document.getElementById('employee_id').value,
        request_date: document.getElementById('request_date').value,
        reason: document.getElementById('reason').value,
        shift_time: document.getElementById('shift_time').value
      };
      
      const res = await fetch('/api/leave-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if(res.ok) {
        document.getElementById('leaveForm').classList.add('hidden');
        document.getElementById('successMsg').classList.remove('hidden');
      } else {
        alert('Có lỗi xảy ra khi nộp yêu cầu.');
      }
    });

    init();
  </script>
</body>
</html>
